<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A1912" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tasbih Digital</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0A1912;
      --text: #F4FFF8;
      --muted: #7A9484;
      --accent: #D4AF37;
      --accent-light: #E8C547;
    }

    * { 
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, #0A1912 0%, #050D0A 100%);
      color: var(--text);
      overflow-x: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      max-width: 100%;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 8px;
      border-left: 4px solid var(--accent);
      padding-left: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--accent);
    }

    .browser-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .browser-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    /* Stats Row */
    .stats-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
    }

    .stat-value.accent {
      color: var(--accent);
    }

    .stat-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
      margin-bottom: 32px;
    }

    /* Main Counter Circle */
    .counter-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    .circle-container {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circle-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(20, 39, 31, 0.4), transparent);
    }

    .circle-progress {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        var(--accent) 0deg,
        var(--accent) var(--progress-angle),
        rgba(212, 175, 55, 0.1) var(--progress-angle),
        rgba(212, 175, 55, 0.1) 360deg
      );
      --progress-angle: 0deg;
    }

    .circle-inner {
      position: relative;
      z-index: 2;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(10, 25, 18, 0.8), rgba(14, 32, 24, 0.8));
      border: 1px solid rgba(212, 175, 55, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .circle-inner:active {
      transform: scale(0.98);
    }

    .dzikir-label {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .counter-value {
      font-size: 72px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      margin: 0;
    }

    .counter-info {
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
      letter-spacing: 0.5px;
    }

    .counter-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Control Buttons */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .reset-btn {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 24px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .reset-btn:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: rgba(212, 175, 55, 0.5);
    }

    .reset-btn:active {
      transform: scale(0.98);
    }

    /* Toggle Buttons */
    .toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .toggle-btn {
      padding: 14px 12px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      background: rgba(212, 175, 55, 0.08);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .toggle-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: rgba(212, 175, 55, 0.5);
    }

    .toggle-icon {
      font-size: 18px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #0A1912;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-switch {
      width: 36px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-switch.active {
      background: var(--accent);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: left 0.3s ease;
    }

    .toggle-switch.active::after {
      left: 18px;
    }

    /* Footer Info */
    .footer-info {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      padding: 16px;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      margin-top: auto;
    }

    .footer-info p {
      margin: 4px 0;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container {
        padding: 16px;
      }

      .circle-container {
        width: 240px;
        height: 240px;
      }

      .circle-inner {
        width: 200px;
        height: 200px;
      }

      .counter-value {
        font-size: 56px;
      }

      .header {
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 16px;
      }

      .stats-row {
        margin-bottom: 24px;
      }

      .stat-value {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Tasbih Digital</h1>
      <div class="browser-indicator">
        <span class="browser-dot"></span>
        <span>Browser</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Total</div>
        <div class="stat-value"><span id="totalCount">0</span><span class="stat-subtitle">/999</span></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Putaran</div>
        <div class="stat-value accent"><span id="roundCount">0</span><span class="stat-subtitle">/10</span></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Main Counter -->
    <div class="counter-section">
      <div class="circle-container" id="circleContainer">
        <div class="circle-progress" id="circleProgress"></div>
        <div class="circle-bg"></div>
        <div class="circle-inner" id="circleInner">
          <div class="dzikir-label">Dzikir</div>
          <div class="counter-value" id="counterValue">0</div>
          <div class="counter-info"><span id="counterInfo">0 / 100</span></div>
          <div class="counter-hint" id="counterHint">Sentuh untuk mulai</div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="reset-btn" id="resetBtn">
        <span>↻</span>
        <span>Reset Ke Nol</span>
      </button>
    </div>

    <!-- Toggles -->
    <div class="toggle-group">
      <button class="toggle-btn" id="vibrationBtn">
        <div>
          <div class="toggle-icon">⚡</div>
          <div>
            <div style="margin-bottom: 2px;">Getar</div>
            <div style="font-size: 10px; color: var(--muted);">PADA</div>
          </div>
        </div>
        <div class="toggle-switch active" id="vibrationSwitch"></div>
      </button>

      <button class="toggle-btn" id="soundBtn">
        <div>
          <div class="toggle-icon">🔊</div>
          <div>
            <div style="margin-bottom: 2px;">Suara</div>
            <div style="font-size: 10px; color: var(--muted);">PADA</div>
          </div>
        </div>
        <div class="toggle-switch active" id="soundSwitch"></div>
      </button>
    </div>

    <!-- Footer -->
    <div class="footer-info">
      <p>Sistem putaran 100 · Total target 999 · Jalan offline setelah di-install</p>
      <p>Tap lingkaran untuk berdzikir, getar & klik dapat diatur</p>
    </div>
  </div>

  <script>
    const MAX_COUNT = 999;
    const ROUND_SIZE = 100;
    const MAX_ROUNDS = 10;

    // DOM Elements
    const circleInner = document.getElementById('circleInner');
    const circleProgress = document.getElementById('circleProgress');
    const counterValue = document.getElementById('counterValue');
    const counterInfo = document.getElementById('counterInfo');
    const counterHint = document.getElementById('counterHint');
    const totalCount = document.getElementById('totalCount');
    const roundCount = document.getElementById('roundCount');
    const resetBtn = document.getElementById('resetBtn');
    const vibrationBtn = document.getElementById('vibrationBtn');
    const soundBtn = document.getElementById('soundBtn');
    const vibrationSwitch = document.getElementById('vibrationSwitch');
    const soundSwitch = document.getElementById('soundSwitch');

    // State
    let count = 0;
    let vibrationEnabled = true;
    let soundEnabled = true;
    let audioContext = null;

    // Initialize Audio Context on first user interaction
    function initAudioContext() {
      if (audioContext) return;
      
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (AudioCtor) {
        audioContext = new AudioCtor();
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
      }
    }

    // Load from localStorage
    function loadState() {
      const saved = localStorage.getItem('tasbih-state');
      if (saved) {
        const state = JSON.parse(saved);
        count = state.count || 0;
        vibrationEnabled = state.vibration !== false;
        soundEnabled = state.sound !== false;
      }
    }

    // Save to localStorage
    function saveState() {
      localStorage.setItem('tasbih-state', JSON.stringify({
        count,
        vibration: vibrationEnabled,
        sound: soundEnabled
      }));
    }

    function updateUI() {
      // Update counter - show progress within current round (0-99)
      const progressInRound = count % ROUND_SIZE;
      counterValue.textContent = progressInRound;
      counterInfo.textContent = `${progressInRound} / ${ROUND_SIZE}`;
      
      // Update circle progress (0-100%)
      const progress = (progressInRound / ROUND_SIZE) * 100;
      const angle = (progress / 100) * 360;
      circleProgress.style.setProperty('--progress-angle', `${angle}deg`);

      // Update stats
      totalCount.textContent = count;
      
      // Calculate round correctly: 0-99 = Round 0, 100-199 = Round 1, etc.
      const currentRound = Math.floor(count / ROUND_SIZE);
      roundCount.textContent = currentRound;

      // Update hint
      if (progressInRound === 0 && count > 0) {
        counterHint.textContent = 'Putaran ' + currentRound + ' selesai!';
      } else if (count === 0) {
        counterHint.textContent = 'Sentuh untuk mulai';
      } else {
        counterHint.textContent = 'Lanjutkan dzikir';
      }

      saveState();
    }

    function playTone() {
      if (!soundEnabled) return;
      
      initAudioContext();
      if (!audioContext) return;

      try {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        const now = audioContext.currentTime;

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(800, now);
        oscillator.frequency.exponentialRampToValueAtTime(200, now + 0.08);

        gainNode.gain.setValueAtTime(0.0001, now);
        gainNode.gain.exponentialRampToValueAtTime(0.15, now + 0.01);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + 0.15);
      } catch (error) {
        console.warn('Audio not supported:', error);
      }
    }

    function addCount() {
      if (count >= MAX_COUNT) return;
      
      count += 1;
      updateUI();

      if (vibrationEnabled && navigator.vibrate) {
        navigator.vibrate(20);
      }

      playTone();

      // Animate
      counterValue.style.transform = 'scale(1.2)';
      setTimeout(() => {
        counterValue.style.transform = 'scale(1)';
      }, 150);
    }

    function resetCount() {
      if (confirm('Reset penghitung? Angka akan kembali ke 0.')) {
        count = 0;
        updateUI();

        if (vibrationEnabled && navigator.vibrate) {
          navigator.vibrate([20, 30, 20]);
        }
      }
    }

    function toggleVibration() {
      vibrationEnabled = !vibrationEnabled;
      vibrationSwitch.classList.toggle('active');
      saveState();
      
      if (vibrationEnabled) {
        navigator.vibrate && navigator.vibrate(30);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      soundSwitch.classList.toggle('active');
      saveState();

      if (soundEnabled) {
        playTone();
      }
    }

    // Event listeners
    circleInner.addEventListener('click', addCount);
    circleInner.addEventListener('touchend', (e) => {
      e.preventDefault();
      addCount();
    });

    resetBtn.addEventListener('click', resetCount);
    vibrationBtn.addEventListener('click', toggleVibration);
    soundBtn.addEventListener('click', toggleSound);

    // Initialize audio context on first interaction
    document.addEventListener('click', initAudioContext, { once: true });
    document.addEventListener('touchstart', initAudioContext, { once: true });

    // Initialize
    loadState();
    updateUI();

    // Update vibration/sound button states
    if (!vibrationEnabled) vibrationSwitch.classList.remove('active');
    if (!soundEnabled) soundSwitch.classList.remove('active');

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((error) => {
          console.error('Service worker registration failed:', error);
        });
      });
    }

    // Prevent zoom on iOS and text selection
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Disable context menu on long press
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
