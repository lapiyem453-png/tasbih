<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A1912" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tasbih Digital</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0A1912;
      --card: #11261d;
      --text: #F4FFF8;
      --muted: #B9D4C1;
      --accent: #8DE6B1;
      --accent-strong: #57d68b;
      --accent-light: #A8F0C7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #143326 0%, #0A1912 45%);
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .app {
      width: min(100%, 440px);
      position: relative;
    }

    /* Floating particles background */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .card {
      background: linear-gradient(180deg, rgba(20, 39, 31, 0.95), rgba(10, 25, 18, 0.96));
      border: 1px solid rgba(141, 230, 177, 0.24);
      border-radius: 28px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.28);
      padding: 28px 22px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
    }

    .label {
      margin: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .counter-container {
      position: relative;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .count {
      text-align: center;
      font-size: clamp(3.2rem, 15vw, 6.2rem);
      line-height: 1;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-strong));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: transform 0.2s ease;
    }

    .count.pulse {
      animation: pulse 0.4s ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .glow-ring {
      position: absolute;
      width: 150px;
      height: 150px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
    }

    .glow-ring.active {
      animation: glow 0.8s ease-out;
    }

    @keyframes glow {
      0% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.4);
      }
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.96rem;
      color: var(--muted);
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .meta span {
      font-weight: 500;
    }

    .progress {
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      height: 12px;
      margin-bottom: 22px;
      border: 1px solid rgba(141, 230, 177, 0.16);
    }

    .progress-bar {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border-radius: inherit;
      transition: width 0.18s ease;
      box-shadow: 0 0 12px rgba(141, 230, 177, 0.4);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
      position: relative;
      overflow: hidden;
    }

    button:active { 
      transform: scale(0.96);
    }

    button:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      color: #0B1A14;
      box-shadow: 0 8px 20px rgba(141, 230, 177, 0.3);
    }

    .primary:hover {
      box-shadow: 0 12px 28px rgba(141, 230, 177, 0.4);
    }

    .secondary {
      background: rgba(141, 230, 177, 0.12);
      color: var(--text);
      border: 1px solid rgba(141, 230, 177, 0.24);
    }

    .secondary:hover {
      background: rgba(141, 230, 177, 0.18);
      border-color: rgba(141, 230, 177, 0.4);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0);
      animation: ripple-animation 0.6s ease-out;
      pointer-events: none;
    }

    @keyframes ripple-animation {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    .milestone-badge {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #0B1A14;
      padding: 20px 40px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.2rem;
      z-index: 100;
      pointer-events: none;
      animation: float-up 2s ease-out forwards;
      box-shadow: 0 10px 40px rgba(141, 230, 177, 0.4);
    }

    @keyframes float-up {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.8);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -150px) scale(1);
      }
    }

    @media (max-width: 420px) {
      .card {
        padding: 24px 16px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .counter-container {
        height: 140px;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <main class="app">
    <section class="card">
      <p class="label">✨ Tasbih Digital</p>
      
      <div class="counter-container">
        <div class="glow-ring" id="glowRing"></div>
        <h1 class="count" id="count">0</h1>
      </div>

      <div class="meta">
        <span id="round">Ronda 1</span>
        <span id="progressText">0%</span>
      </div>
      <div class="progress" aria-label="Progress">
        <span class="progress-bar" id="progressBar"></span>
      </div>
      <div class="controls">
        <button class="primary" id="addBtn" type="button">✨ +1 Tasbih</button>
        <button class="secondary" id="resetBtn" type="button">🔄 Reset</button>
      </div>
    </section>
  </main>

  <script>
    const MAX_COUNT = 999;
    const countEl = document.getElementById('count');
    const roundEl = document.getElementById('round');
    const progressTextEl = document.getElementById('progressText');
    const progressBarEl = document.getElementById('progressBar');
    const addBtn = document.getElementById('addBtn');
    const resetBtn = document.getElementById('resetBtn');
    const glowRing = document.getElementById('glowRing');
    const particlesContainer = document.getElementById('particles');

    let count = 0;

    const milestones = [100, 200, 300, 400, 500, 600, 700, 800, 900, 999];

    function updateUi() {
      countEl.textContent = count;
      countEl.classList.remove('pulse');
      void countEl.offsetWidth; // Trigger reflow
      countEl.classList.add('pulse');

      const currentRound = Math.floor(count / 100) + 1;
      roundEl.textContent = count === 0 ? 'Ronda 1' : 'Ronda ' + currentRound;

      const progress = (count / MAX_COUNT) * 100;
      progressTextEl.textContent = Math.round(progress) + '%';
      progressBarEl.style.width = progress + '%';

      // Check milestones
      if (milestones.includes(count)) {
        showMilestone();
      }
    }

    function createGlowEffect() {
      glowRing.classList.remove('active');
      void glowRing.offsetWidth; // Trigger reflow
      glowRing.classList.add('active');
    }

    function createParticle() {
      const particle = document.createElement('div');
      particle.className = 'particle';
      
      const size = Math.random() * 8 + 4;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      
      const startX = Math.random() * window.innerWidth;
      const startY = window.innerHeight / 2;
      particle.style.left = startX + 'px';
      particle.style.top = startY + 'px';
      
      particlesContainer.appendChild(particle);
      
      const duration = Math.random() * 1000 + 800;
      const endY = Math.random() * 200 - 100;
      const endX = (Math.random() - 0.5) * 200;
      
      particle.animate([
        { 
          opacity: 1, 
          transform: 'translate(0, 0) scale(1)' 
        },
        { 
          opacity: 0, 
          transform: `translate(${endX}px, ${endY}px) scale(0)` 
        }
      ], {
        duration: duration,
        easing: 'ease-out'
      });

      setTimeout(() => particle.remove(), duration);
    }

    function showMilestone() {
      const badge = document.createElement('div');
      badge.className = 'milestone-badge';
      badge.textContent = '🎉 Milestone: ' + count;
      document.body.appendChild(badge);
      
      setTimeout(() => badge.remove(), 2000);

      // Create multiple particles
      for (let i = 0; i < 12; i++) {
        setTimeout(() => createParticle(), i * 50);
      }
    }

    function playTone() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;

      try {
        const audioCtx = new AudioCtor();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const now = audioCtx.currentTime;

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(900, now);
        oscillator.frequency.exponentialRampToValueAtTime(180, now + 0.1);

        gainNode.gain.setValueAtTime(0.0001, now);
        gainNode.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start(now);
        oscillator.stop(now + 0.17);
      } catch (error) {
        console.warn('Audio not supported:', error);
      }
    }

    function addCount() {
      if (count >= MAX_COUNT) return;
      count += 1;
      updateUi();
      createGlowEffect();
      createParticle();

      if (navigator.vibrate) {
        navigator.vibrate(24);
      }

      playTone();
    }

    function resetCount() {
      count = 0;
      updateUi();

      if (navigator.vibrate) {
        navigator.vibrate([20, 20, 40]);
      }
    }

    // Add ripple effect to buttons
    function createRipple(event) {
      const button = event.currentTarget;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      
      const rect = button.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = event.clientX - rect.left - size / 2;
      const y = event.clientY - rect.top - size / 2;
      
      ripple.style.width = size + 'px';
      ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      
      button.appendChild(ripple);
      
      setTimeout(() => ripple.remove(), 600);
    }

    addBtn.addEventListener('click', addCount);
    addBtn.addEventListener('click', createRipple);
    resetBtn.addEventListener('click', resetCount);
    resetBtn.addEventListener('click', createRipple);

    updateUi();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((error) => {
          console.error('Service worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
